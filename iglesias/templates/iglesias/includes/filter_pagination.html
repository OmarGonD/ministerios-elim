{% if page_obj.has_other_pages %}
<nav class="mt-5" aria-label="Paginación">
  <ul class="pagination justify-content-center flex-wrap">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ request.GET.urlencode }}&page={{ page_obj.previous_page_number }}">Anterior</a></li>{% endif %}
    <li class="page-item active"><span class="page-link">{{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ request.GET.urlencode }}&page={{ page_obj.next_page_number }}">Siguiente</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
